version: 7.28.2

type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - countries

streams:
  - type: DeclarativeStream
    name: countries
    retriever:
      type: SimpleRetriever
      paginator:
        type: DefaultPaginator
        page_size_option:
          type: RequestOption
          field_name: limit
          inject_into: request_parameter
        page_token_option:
          type: RequestOption
          field_name: offset
          inject_into: request_parameter
        pagination_strategy:
          type: OffsetIncrement
          page_size: "{{ config['page_size'] }}"
          inject_on_first_request: true
      requester:
        type: HttpRequester
        url: https://api.restcountries.com/countries/v5
        http_method: GET
        authenticator:
          type: BearerAuthenticator
          api_token: "{{ config['api_key'] }}"
        request_parameters:
          pretty: "1"
          response_fields: names.common,codes.alpha_2,codes.alpha_3,codes.ccn3,region,capitals
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - data
            - objects
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        $schema: http://json-schema.org/schema#
        properties:
          _meta:
            type:
              - object
              - "null"
            properties:
              lastUpdatedTimestamp:
                type:
                  - number
                  - "null"
          codes:
            type:
              - object
              - "null"
            properties:
              ccn3:
                type:
                  - string
                  - "null"
              alpha_2:
                type:
                  - string
                  - "null"
              alpha_3:
                type:
                  - string
                  - "null"
          names:
            type:
              - object
              - "null"
            properties:
              common:
                type:
                  - string
                  - "null"
          region:
            type:
              - string
              - "null"
          capitals:
            type:
              - array
              - "null"
            items:
              type:
                - object
                - "null"
              properties:
                name:
                  type:
                    - string
                    - "null"
                attributes:
                  type:
                    - object
                    - "null"
                  properties:
                    primary:
                      type:
                        - boolean
                        - "null"
                    judicial:
                      type:
                        - boolean
                        - "null"
                    executive:
                      type:
                        - boolean
                        - "null"
                    legislative:
                      type:
                        - boolean
                        - "null"
                    administrative:
                      type:
                        - boolean
                        - "null"
                    constitutional:
                      type:
                        - boolean
                        - "null"
                coordinates:
                  type:
                    - object
                    - "null"
                  properties:
                    lat:
                      type:
                        - number
                        - "null"
                    lng:
                      type:
                        - number
                        - "null"
          contry_code:
            type:
              - string
              - "null"
        additionalProperties: true
    transformations:
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - contry_code
            value: "{{ record['codes']['alpha_2'] }}"
            value_type: string

spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - api_key
    properties:
      api_key:
        type: string
        order: 0
        title: API Key
        airbyte_secret: true
      page_size:
        type: integer
        order: 1
        title: Page size
        default: 100
    additionalProperties: true

metadata:
  testedStreams:
    stream_0:
      streamHash: ad11f9fa446b445a056b0f48d54e74059e0bc977
    countries:
      isStale: false
      hasRecords: true
      streamHash: 05fa1c7d86c1c506d9295fe69400a4b2e5e7b766
      hasResponse: true
      primaryKeysAreUnique: true
      primaryKeysArePresent: true
      responsesAreSuccessful: true
  autoImportSchema:
    countries: true
