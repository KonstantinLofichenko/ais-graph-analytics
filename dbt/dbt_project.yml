name: 'ais_graph_analytics'
version: '1.0.0'
config-version: 2

profile: 'ais_graph_analytics'

model-paths: ["models"]
test-paths: ["tests"]

models:
  ais_graph_analytics:
    staging:
      +materialized: view
    marts:
      +materialized: table

vars:
  ais_max_valid_speed_kn: 102.2
  ais_analysis_start_date: '2026-09-01 00:00:00'
  ais_stationary_speed_kn: 0.5
  ai_model: "{{ env_var('OPENAI_MODEL', 'gpt-6-luna') }}"
  ai_prompt_version: 'vessel_anomaly_v1'
