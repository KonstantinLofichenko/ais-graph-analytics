version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: countries
        description: "Country reference data loaded from REST Countries API by Airbyte."

      - name: ais_positions
        description: "Raw AIS position events loaded into ClickHouse."

      - name: hais_positions
        description: "Raw historical AIS (HAIS) position events loaded into ClickHouse."

  - name: analytics
    schema: analytics
    tables:
      - name: port_visits
        description: "Versioned vessel port visits; consumers must use FINAL and is_deleted = 0."
        columns:
          - name: activity_date
            description: >-
              UTC processing window-start date supplied by the writer. Legacy
              dates are backfilled from port_visit_runs.window_start. Physical
              Nullable(Date) allows unmigrated versions to stay unknown; active
              logical rows must be non-null after migration 010 and its backfill.

      - name: port_visit_runs
        description: "Metadata for completed port visit processing runs."

      - name: port_graph_metrics
        description: "Versioned snapshot-specific graph metrics; consumers must use FINAL and is_deleted = 0."

      - name: ports
        description: "Port reference data used by the port visit and graph pipelines."

      - name: vessel_ai_input_hashes
        description: "Exact typed candidate values mapped to the canonical Python input_hash; read FINAL."

      - name: vessel_ai_enrichment
        description: "AI enrichment data for vessels, including activity classification and notable behaviors."
