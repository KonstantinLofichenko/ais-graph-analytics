version: 2

models:
  - name: vessel_daily_features
    columns:
      - name: mmsi
        data_tests:
          - not_null
      - name: activity_date
        data_tests:
          - not_null

  - name: vessel_daily_anomalies
    data_tests:
      - unique:
          arguments:
            column_name: "tuple(activity_date, mmsi)"
      - unique:
          arguments:
            column_name: "tuple(activity_date, anomaly_rank)"
    columns:
      - name: mmsi
        data_tests:
          - not_null
      - name: activity_date
        data_tests:
          - not_null
      - name: anomaly_rank
        data_tests:
          - not_null

  - name: vessel_daily_enriched
    description: "Current features with AI only for an exact current top-100 input/model/prompt match; response history is retained separately."
    data_tests:
      - valid_current_ai
      - unique:
          arguments:
            column_name: "tuple(activity_date, mmsi)"
    columns:
      - name: mmsi
        data_tests:
          - not_null
      - name: activity_date
        data_tests:
          - not_null
