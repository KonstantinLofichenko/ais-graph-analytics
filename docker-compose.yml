services:
  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: ais-airflow
    profiles: ["batch"]
    command: standalone
    depends_on:
      clickhouse:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/ais/airflow/dags
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__CORE__PARALLELISM: "1"
      CLICKHOUSE_URL: http://ais-clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_HOST: ais-clickhouse
      CLICKHOUSE_PORT: "8123"
      DBT_CLICKHOUSE_HOST: ais-clickhouse
      DBT_CLICKHOUSE_PORT: "8123"
      DBT_ENV_SECRET_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      DBT_PROFILES_DIR: /opt/ais/dbt
      PYTHONPATH: /opt/ais
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      AI_ENRICHMENT_LIMIT: ${AI_ENRICHMENT_LIMIT:-100}
      BW_AIS_CLIENT_ID: ${BW_AIS_CLIENT_ID}
      BW_AIS_CLIENT_SECRET: ${BW_AIS_CLIENT_SECRET}
      BW_TOKEN_URL: ${BW_TOKEN_URL}
      BW_HISTORIC_BASE_URL: ${BW_HISTORIC_BASE_URL:-https://historic.ais.barentswatch.no}
      BW_HISTORIC_SCOPE: ${BW_HISTORIC_SCOPE:-ais}
      BW_HISTORIC_WINDOW_HOURS: ${BW_HISTORIC_WINDOW_HOURS:-24}
      BW_HISTORIC_BATCH_SIZE: ${BW_HISTORIC_BATCH_SIZE:-5000}
      BW_HISTORIC_REQUEST_TIMEOUT_SECONDS: ${BW_HISTORIC_REQUEST_TIMEOUT_SECONDS:-60}
      BW_HISTORIC_POLYGON_JSON: ${BW_HISTORIC_POLYGON_JSON}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_DATABASE: neo4j
      PORT_VISITS_WINDOW_HOURS: ${PORT_VISITS_WINDOW_HOURS:-24}
      PORT_VISITS_MAX_ROWS: ${PORT_VISITS_MAX_ROWS:-500000}
      PORTS_SOURCE_URL: ${PORTS_SOURCE_URL}
      PORTS_COUNTRY: ${PORTS_COUNTRY:-NO}
      PORTS_MIN_LAT: ${PORTS_MIN_LAT:-60}
      PORTS_MAX_LAT: ${PORTS_MAX_LAT:-61}
      PORTS_MIN_LON: ${PORTS_MIN_LON:-4}
      PORTS_MAX_LON: ${PORTS_MAX_LON:-6}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - airflow-data:/opt/airflow
      - ${HAIS_HOST_DIR:-./data/hais}:/opt/ais/data/hais:ro
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local > /dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      start_period: 90s
      retries: 5
    networks:
      - ais-network

  ais-producer:
    build: ./producers/ais
    profiles: ["live"]
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?KAFKA_BOOTSTRAP_SERVERS is required}
      KAFKA_TOPIC: ${KAFKA_TOPIC:?KAFKA_TOPIC is required}
      AIS_MESSAGE_LIMIT: "${AIS_MESSAGE_LIMIT:-}"
    depends_on:
      ais-kafka:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 45s
    networks:
      - ais-network

  ais-kafka:
    image: apache/kafka:4.3.1
    container_name: ais-kafka
    hostname: ais-kafka
    environment:
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://ais-kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@ais-kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - ais-network

  ksqldb-server:
    image: confluentinc/cp-ksqldb-server:8.3.1
    container_name: ksqldb-server
    depends_on:
      ais-kafka:
        condition: service_healthy
    environment:
      KSQL_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?KAFKA_BOOTSTRAP_SERVERS is required}
      KSQL_LISTENERS: http://0.0.0.0:8088
      KSQL_KSQL_SERVICE_ID: ais_ksqldb
      KSQL_KSQL_LOG4J_ROOT_LOGLEVEL: INFO
      KSQL_KSQL_HIDDEN_TOPICS: '^_.*'
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8088'"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - ais-network

  kafka-connect:
    image: confluentinc/cp-kafka-connect:8.3.1
    container_name: kafka-connect
    depends_on:
      ais-kafka:
        condition: service_healthy
    environment:
      CONNECT_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?KAFKA_BOOTSTRAP_SERVERS is required}
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: ais-connect-cluster
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components,/usr/share/java/plugins
    volumes:
      - ./plugins:/usr/share/java/plugins
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8083'"]
      interval: 10s
      timeout: 5s
      retries: 18
    networks:
      - ais-network

  kafbat-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafbat-ui
    depends_on:
      ais-kafka:
        condition: service_healthy
      ksqldb-server:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?KAFKA_BOOTSTRAP_SERVERS is required}
      KAFKA_CLUSTERS_0_KSQLDBSERVER: http://ksqldb-server:8088
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: local-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    ports:
      - "8081:8080"
    networks:
      - ais-network

  neo4j:
    build:
      context: ./neo4j
      dockerfile: Dockerfile
    image: ais-neo4j:2026.07.1-clickhouse-jdbc
    container_name: ais-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      HEALTHCHECK_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc","apoc-extended","graph-data-science"]'
      NEO4J_apoc_jdbc_clickhouse_url: jdbc:clickhouse:http://ais-clickhouse:8123/default?jdbc_ignore_unsupported_values=true
      NEO4J_apoc_jdbc_clickhouse_user: ${CLICKHOUSE_USER:-default}
      NEO4J_apoc_jdbc_clickhouse_password: ${CLICKHOUSE_PASSWORD}
      NEO4J_dbms_security_procedures_unrestricted: apoc.load.jdbc,apoc.load.driver,gds.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${HEALTHCHECK_PASSWORD}\" 'RETURN 1' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - ais-network

  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    container_name: ais-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-ais}
      # Init scripts preserve history and migrate derived destinations on existing volumes.
      CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS: "1"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./clickhouse/init:/docker-entrypoint-initdb.d
      - ${HAIS_HOST_DIR:-./data/hais}:/var/lib/clickhouse/user_files/hais:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query \"SELECT 1\" > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - ais-network

  metabase:
    image: metabase/metabase:v0.63.17.x
    container_name: ais-metabase
    restart: unless-stopped
    profiles:
      - analytics
    ports:
      - "3000:3000"
    environment:
      JAVA_TIMEZONE: UTC
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      - clickhouse
    networks:
      - ais-network

  flink-checkpoint-init:
    image: ais-flink:2.2.1
    build:
      context: ./flink
      dockerfile: Dockerfile
    profiles: ["streaming"]
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /opt/flink/checkpoints && chown flink:flink /opt/flink/checkpoints"]
    volumes:
      - ./flink/checkpoints:/opt/flink/checkpoints

  flink-jobmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    image: ais-flink:2.2.1
    container_name: ais-flink-jobmanager
    profiles: ["streaming"]
    command: jobmanager
    ports:
      - "8082:8081"
    environment: &flink-environment
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?KAFKA_BOOTSTRAP_SERVERS is required}
      KAFKA_TOPIC: ${KAFKA_TOPIC:?KAFKA_TOPIC is required}
      FLINK_SINK_TOPIC: ${FLINK_SINK_TOPIC:?FLINK_SINK_TOPIC is required}
      FLINK_REFERENCE_DIR: ${FLINK_REFERENCE_DIR:?FLINK_REFERENCE_DIR is required}
      FLINK_GAP_SOURCE_TOPIC: ${FLINK_GAP_SOURCE_TOPIC:?FLINK_GAP_SOURCE_TOPIC is required}
      FLINK_GAP_TOPIC: ${FLINK_GAP_TOPIC:?FLINK_GAP_TOPIC is required}
      FLINK_GAP_GROUP_ID: ${FLINK_GAP_GROUP_ID:?FLINK_GAP_GROUP_ID is required}
      FLINK_GAP_TIMEOUT_SECONDS: ${FLINK_GAP_TIMEOUT_SECONDS:?FLINK_GAP_TIMEOUT_SECONDS is required}
      FLINK_FEATURE_SOURCE_TOPIC: ${FLINK_FEATURE_SOURCE_TOPIC:?FLINK_FEATURE_SOURCE_TOPIC is required}
      FLINK_FEATURE_TOPIC: ${FLINK_FEATURE_TOPIC:?FLINK_FEATURE_TOPIC is required}
      FLINK_FEATURE_GROUP_ID: ${FLINK_FEATURE_GROUP_ID:?FLINK_FEATURE_GROUP_ID is required}
      FLINK_FEATURE_WINDOWS_MINUTES: ${FLINK_FEATURE_WINDOWS_MINUTES:?FLINK_FEATURE_WINDOWS_MINUTES is required}
      FLINK_FEATURE_SLIDE_MINUTES: ${FLINK_FEATURE_SLIDE_MINUTES:?FLINK_FEATURE_SLIDE_MINUTES is required}
      FLINK_FEATURE_WATERMARK_SECONDS: ${FLINK_FEATURE_WATERMARK_SECONDS:?FLINK_FEATURE_WATERMARK_SECONDS is required}
      FLINK_FEATURE_IDLE_SECONDS: ${FLINK_FEATURE_IDLE_SECONDS:?FLINK_FEATURE_IDLE_SECONDS is required}
      FLINK_CHECKPOINT_INTERVAL_SECONDS: ${FLINK_CHECKPOINT_INTERVAL_SECONDS:-60}
      FLINK_CHECKPOINT_TIMEOUT_SECONDS: ${FLINK_CHECKPOINT_TIMEOUT_SECONDS:-120}
      FLINK_CHECKPOINT_MIN_PAUSE_SECONDS: ${FLINK_CHECKPOINT_MIN_PAUSE_SECONDS:-10}
      FLINK_CHECKPOINT_DIR: ${FLINK_CHECKPOINT_DIR:-file:///opt/flink/checkpoints}
      FLINK_RESTART_ATTEMPTS: ${FLINK_RESTART_ATTEMPTS:-10}
      FLINK_RESTART_DELAY_SECONDS: ${FLINK_RESTART_DELAY_SECONDS:-10}
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 1
        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: ${FLINK_RESTART_ATTEMPTS:-10}
        restart-strategy.fixed-delay.delay: ${FLINK_RESTART_DELAY_SECONDS:-10} s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/overview', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 60
    volumes:
      - ./flink/sql:/opt/flink/sql:ro
      - ./flink/checkpoints:/opt/flink/checkpoints
      - ./flink/jobs:/opt/flink/jobs:ro
      - ./dbt/seeds:${FLINK_REFERENCE_DIR:?FLINK_REFERENCE_DIR is required}:ro
    depends_on:
      flink-checkpoint-init:
        condition: service_completed_successfully
      ais-kafka:
        condition: service_healthy
    networks:
      - ais-network

  flink-taskmanager: &flink-taskmanager
    build:
      context: ./flink
      dockerfile: Dockerfile
    image: ais-flink:2.2.1
    container_name: ais-flink-taskmanager
    profiles: ["streaming"]
    command: taskmanager
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?KAFKA_BOOTSTRAP_SERVERS is required}
      KAFKA_TOPIC: ${KAFKA_TOPIC:?KAFKA_TOPIC is required}
      FLINK_SINK_TOPIC: ${FLINK_SINK_TOPIC:?FLINK_SINK_TOPIC is required}
      FLINK_REFERENCE_DIR: ${FLINK_REFERENCE_DIR:?FLINK_REFERENCE_DIR is required}
      FLINK_GAP_SOURCE_TOPIC: ${FLINK_GAP_SOURCE_TOPIC:?FLINK_GAP_SOURCE_TOPIC is required}
      FLINK_GAP_TOPIC: ${FLINK_GAP_TOPIC:?FLINK_GAP_TOPIC is required}
      FLINK_GAP_GROUP_ID: ${FLINK_GAP_GROUP_ID:?FLINK_GAP_GROUP_ID is required}
      FLINK_GAP_TIMEOUT_SECONDS: ${FLINK_GAP_TIMEOUT_SECONDS:?FLINK_GAP_TIMEOUT_SECONDS is required}
      FLINK_FEATURE_SOURCE_TOPIC: ${FLINK_FEATURE_SOURCE_TOPIC:?FLINK_FEATURE_SOURCE_TOPIC is required}
      FLINK_FEATURE_TOPIC: ${FLINK_FEATURE_TOPIC:?FLINK_FEATURE_TOPIC is required}
      FLINK_FEATURE_GROUP_ID: ${FLINK_FEATURE_GROUP_ID:?FLINK_FEATURE_GROUP_ID is required}
      FLINK_FEATURE_WINDOWS_MINUTES: ${FLINK_FEATURE_WINDOWS_MINUTES:?FLINK_FEATURE_WINDOWS_MINUTES is required}
      FLINK_FEATURE_SLIDE_MINUTES: ${FLINK_FEATURE_SLIDE_MINUTES:?FLINK_FEATURE_SLIDE_MINUTES is required}
      FLINK_FEATURE_WATERMARK_SECONDS: ${FLINK_FEATURE_WATERMARK_SECONDS:?FLINK_FEATURE_WATERMARK_SECONDS is required}
      FLINK_FEATURE_IDLE_SECONDS: ${FLINK_FEATURE_IDLE_SECONDS:?FLINK_FEATURE_IDLE_SECONDS is required}
      FLINK_CHECKPOINT_INTERVAL_SECONDS: ${FLINK_CHECKPOINT_INTERVAL_SECONDS:-60}
      FLINK_CHECKPOINT_TIMEOUT_SECONDS: ${FLINK_CHECKPOINT_TIMEOUT_SECONDS:-120}
      FLINK_CHECKPOINT_MIN_PAUSE_SECONDS: ${FLINK_CHECKPOINT_MIN_PAUSE_SECONDS:-10}
      FLINK_CHECKPOINT_DIR: ${FLINK_CHECKPOINT_DIR:-file:///opt/flink/checkpoints}
      FLINK_RESTART_ATTEMPTS: ${FLINK_RESTART_ATTEMPTS:-10}
      FLINK_RESTART_DELAY_SECONDS: ${FLINK_RESTART_DELAY_SECONDS:-10}
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 1
        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: ${FLINK_RESTART_ATTEMPTS:-10}
        restart-strategy.fixed-delay.delay: ${FLINK_RESTART_DELAY_SECONDS:-10} s
    volumes:
      - ./dbt/seeds:${FLINK_REFERENCE_DIR:?FLINK_REFERENCE_DIR is required}:ro
      - ./flink/checkpoints:/opt/flink/checkpoints
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      ais-kafka:
        condition: service_healthy
    networks:
      - ais-network

  # Additional slots allow the derived-stream jobs and optional smoke job to coexist.
  flink-feature-taskmanager:
    <<: *flink-taskmanager
    container_name: ais-flink-feature-taskmanager

  flink-job-submitter:
    # Only this one-shot client writes the root-owned named registry volume.
    user: "0:0"
    image: ais-flink:2.2.1
    build:
      context: ./flink
      dockerfile: Dockerfile
    profiles: ["streaming"]
    command: ["python", "/opt/flink/scripts/submit_jobs.py"]
    environment:
      <<: *flink-environment
      FLINK_REST_URL: http://flink-jobmanager:8081
      FLINK_REQUIRED_TASKMANAGERS: "2"
      FLINK_SUBMIT_TIMEOUT_SECONDS: "300"
    volumes:
      - ./flink/jobs:/opt/flink/jobs:ro
      - ./flink/scripts:/opt/flink/scripts:ro
      - ./dbt/seeds:${FLINK_REFERENCE_DIR:?FLINK_REFERENCE_DIR is required}:ro
      - flink-submitter-state:/opt/flink/submitter-state
      - ./flink/checkpoints:/opt/flink/checkpoints
    depends_on:
      ais-kafka:
        condition: service_healthy
      flink-jobmanager:
        condition: service_healthy
        restart: true
      flink-taskmanager:
        condition: service_started
        restart: true
      flink-feature-taskmanager:
        condition: service_started
        restart: true
    networks:
      - ais-network

networks:
  ais-network:
    name: ais-network
    driver: bridge

volumes:
  kafka-data:
  airflow-data:
  neo4j-data:
  neo4j-logs:
  clickhouse-data:
  clickhouse-logs:
  metabase_data:
  flink-submitter-state:
