name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuration:
    name: Shell and Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check tracked shell scripts
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(git ls-files -z '*.sh')
      - name: Validate all Compose profiles with example configuration
        run: |
          cp .env.example .env
          docker compose --env-file .env.example --profile '*' config --quiet

  pipelines:
    name: Pipeline tests and consolidated Airflow DAG validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build the project Airflow image
        run: docker build --file airflow/Dockerfile --tag ais-airflow-ci .
      # Includes master discovery, shared dates, child failure propagation, and AI limits.
      # No scheduler, databases, or OpenAI calls run in CI.
      - name: Run isolated pipeline, AI enrichment, and merged DAG tests
        run: |
          docker run --rm --network none \
            --volume "$PWD:/workspace:ro" --workdir /workspace \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env PYTHON_DOTENV_DISABLED=1 \
            --env PYTHONPATH=/workspace:/workspace/airflow/dags \
            --env AIRFLOW_HOME=/tmp/airflow-ci \
            --env AIRFLOW__CORE__LOAD_EXAMPLES=false \
            --env AIRFLOW__CORE__DAGS_FOLDER=/tmp/airflow-ci/dags \
            --entrypoint bash ais-airflow-ci scripts/ci-unit-tests.sh

  producer:
    name: Producer unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: producers/ais/requirements.txt
      - run: python -m pip install -r producers/ais/requirements.txt
      - run: python -m unittest discover -s producers/ais/tests -v

  dbt:
    name: dbt parse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DBT_ENV_SECRET_CLICKHOUSE_PASSWORD: ci-placeholder-not-a-secret
      CLICKHOUSE_USER: default
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: dbt/requirements.txt
      - run: python -m pip install -r dbt/requirements.txt
      - name: Parse using the example profile without connecting to ClickHouse
        run: |
          cp dbt/profiles.yml.example dbt/profiles.yml
          dbt parse --project-dir dbt --profiles-dir dbt --no-partial-parse
      - name: Check models required by the consolidated master
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('dbt/target/manifest.json').read_text())
          required = {
              'vessels', 'vessel_daily_features', 'current_port_visits',
              'vessel_daily_anomalies', 'vessel_daily_enriched',
          }
          models = {
              node['name'] for node in manifest['nodes'].values()
              if node['resource_type'] == 'model'
          }
          assert required <= models, f'Missing master DAG models: {required - models}'
          PY
